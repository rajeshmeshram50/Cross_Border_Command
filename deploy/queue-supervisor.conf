; ─────────────────────────────────────────────────────────────────────────────
;  Laravel queue worker — Supervisor service (REQUIRED on Linux servers)
; ─────────────────────────────────────────────────────────────────────────────
;  Runs the background worker that drains the `jobs` table: queued mail
;  (onboarding invites, leave notifications) and the Zoho document jobs.
;
;  WITHOUT THIS RUNNING, QUEUED MAIL IS NEVER DELIVERED. The job row is
;  written to `jobs` and sits there forever — the API still returns 201 and
;  the admin sees "link sent", but no email leaves the server. If invites
;  stop arriving, check `supervisorctl status queue-worker` FIRST.
;
;  INSTALL (run once, as root — `sudo -i`):
;    1) apt-get update && apt-get install -y supervisor      # Debian/Ubuntu
;       (CentOS/AlmaLinux:  yum install -y supervisor)
;    2) Copy this file to:   /etc/supervisor/conf.d/queue-worker.conf
;    3) supervisorctl reread
;       supervisorctl update
;       supervisorctl start queue-worker:*
;       supervisorctl status queue-worker:*      # → both should say RUNNING
;
;  MANAGE:
;    supervisorctl status  queue-worker:*
;    supervisorctl restart queue-worker:*   # run this after EVERY deploy —
;                                           # a worker holds the OLD code in
;                                           # memory until it is restarted
;    tail -f /var/www/html/Cross_Border_Command/storage/logs/queue-worker.log
;
;  CHECK WHAT IS STUCK / FAILED:
;    php artisan queue:failed          # list failures
;    php artisan queue:retry all       # re-run them
;
;  ADJUST the paths below if different on your box:
;    - PHP path : run `which php`   (commonly /usr/bin/php)
;    - App path : run `pwd` in the Laravel root
; ─────────────────────────────────────────────────────────────────────────────

[program:queue-worker]
; --tries=3        : retry a failed job 3 times before parking it in failed_jobs
; --max-time=3600  : recycle the process hourly so a long-lived worker cannot
;                    leak memory indefinitely; supervisor restarts it at once
; --sleep=3        : seconds to idle when the queue is empty
command=/usr/bin/php /var/www/html/Cross_Border_Command/artisan queue:work --tries=3 --max-time=3600 --sleep=3
directory=/var/www/html/Cross_Border_Command
autostart=true
autorestart=true
startretries=10
; Two workers: one slow SMTP send must not hold up the next invite.
numprocs=2
process_name=%(program_name)s_%(process_num)02d
user=root
redirect_stderr=true
stdout_logfile=/var/www/html/Cross_Border_Command/storage/logs/queue-worker.log
; Let an in-flight job finish rather than killing it mid-send.
stopwaitsecs=3600
