; ─────────────────────────────────────────────────────────────────────────────
;  Laravel Reverb — Supervisor service (RECOMMENDED for Linux servers)
; ─────────────────────────────────────────────────────────────────────────────
;  Keeps the Reverb WebSocket server running 24/7: auto-starts on boot and
;  auto-restarts on crash. You do NOT start Reverb manually each time.
;
;  INSTALL (run once, as root — `sudo -i`):
;    1) apt-get update && apt-get install -y supervisor      # Debian/Ubuntu
;       (CentOS/AlmaLinux:  yum install -y supervisor)
;    2) Copy this file to:   /etc/supervisor/conf.d/reverb.conf
;    3) supervisorctl reread
;       supervisorctl update
;       supervisorctl start reverb
;       supervisorctl status reverb        # → should say RUNNING
;
;  MANAGE:
;    supervisorctl status   reverb
;    supervisorctl restart  reverb         # run this after EVERY deploy
;    supervisorctl stop     reverb
;    tail -f /var/www/html/storage/logs/reverb.log
;
;  ADJUST the two paths below if different on your box:
;    - PHP path : run `which php`   (commonly /usr/bin/php)
;    - App path : run `pwd` in the Laravel root (this server uses /var/www/html)
;    - Port     : must match REVERB_SERVER_PORT in .env (this app uses 8085)
; ─────────────────────────────────────────────────────────────────────────────

[program:reverb]
command=/usr/bin/php /var/www/html/Cross_Border_Command/artisan reverb:start --host=0.0.0.0 --port=8085
directory=/var/www/html/Cross_Border_Command
autostart=true
autorestart=true
startretries=10
user=root
redirect_stderr=true
stdout_logfile=/var/www/html/Cross_Border_Command/storage/logs/reverb.log
stopwaitsecs=10
