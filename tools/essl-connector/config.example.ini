[connector]
; ── Device (on the LAN) ─────────────────────────────────────────────
device_ip = 192.168.1.201
device_port = 4370

; ── App / API ───────────────────────────────────────────────────────
; Local pilot:  http://<dev-pc-ip>:8000
; Production:   https://cbc.idims.in
api_base_url = http://192.168.1.50:8000

; Sanctum token for a service user. Mint once on the server:
;   php artisan tinker
;   >>> App\Models\User::find(<id>)->createToken('essl-connector')->plainTextToken
api_token = PASTE_SANCTUM_TOKEN_HERE

; The registered terminal id (HR -> Biometric Devices) — supplies branch,
; timezone and serial for the import. Leave blank to use the token user's
; client + IST.
device_terminal_id = 1

; ── Polling ─────────────────────────────────────────────────────────
poll_interval_seconds = 60
cursor_file = cursor.txt
