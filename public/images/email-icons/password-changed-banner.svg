<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 480 180">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="checkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: pure white -->
  <rect width="480" height="180" fill="#ffffff"/>

  <!-- Confetti -->
  <g fill="#10b981">
    <path d="M 60 40 L 62 44 L 66 46 L 62 48 L 60 52 L 58 48 L 54 46 L 58 44 Z"/>
    <path d="M 420 50 L 422 54 L 426 56 L 422 58 L 420 62 L 418 58 L 414 56 L 418 54 Z"/>
    <rect x="78" y="128" width="6" height="6" transform="rotate(45 81 131)"/>
    <rect x="398" y="128" width="6" height="6" transform="rotate(45 401 131)"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="40" cy="80" r="2.4"/>
    <circle cx="440" cy="100" r="2.4"/>
    <rect x="118" y="28" width="5" height="5" transform="rotate(45 120.5 30.5)"/>
    <rect x="358" y="158" width="5" height="5" transform="rotate(45 360.5 160.5)"/>
  </g>
  <g fill="#a7f3d0">
    <circle cx="170" cy="40" r="3"/>
    <circle cx="310" cy="40" r="3"/>
    <circle cx="160" cy="150" r="2.5"/>
    <circle cx="320" cy="150" r="2.5"/>
  </g>

  <!-- Halo behind shield -->
  <circle cx="240" cy="90" r="62" fill="url(#halo)"/>

  <!-- SHIELD (green) -->
  <path d="M 240 28
           L 282 46
           L 282 96
           Q 282 132 240 152
           Q 198 132 198 96
           L 198 46
           Z"
        fill="url(#shield)"/>

  <!-- Shield highlight -->
  <path d="M 218 50 Q 216 68 220 92" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- White circle inside shield holding the check -->
  <circle cx="240" cy="92" r="24" fill="#ffffff"/>

  <!-- Big green checkmark inside white circle -->
  <path d="M 228 92 L 237 102 L 252 84"
        stroke="url(#checkBg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small padlock at bottom of shield (closed/secured indicator) -->
  <rect x="232" y="125" width="16" height="14" rx="2" fill="#ffffff"/>
  <path d="M 234 125 L 234 119 Q 234 115 240 115 Q 246 115 246 119 L 246 125"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
