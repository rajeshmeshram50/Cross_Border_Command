<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </radialGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Sparkles scattered around -->
  <g fill="#a78bfa">
    <path d="M 28 70 L 30 74 L 34 76 L 30 78 L 28 82 L 26 78 L 22 76 L 26 74 Z"/>
    <path d="M 172 76 L 174 80 L 178 82 L 174 84 L 172 88 L 170 84 L 166 82 L 170 80 Z"/>
  </g>
  <g fill="#c4b5fd">
    <path d="M 44 110 L 45 113 L 48 114 L 45 115 L 44 118 L 43 115 L 40 114 L 43 113 Z"/>
    <path d="M 156 110 L 157 113 L 160 114 L 157 115 L 156 118 L 155 115 L 152 114 L 155 113 Z"/>
    <circle cx="14" cy="80" r="1.5"/>
    <circle cx="186" cy="80" r="1.5"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="62" cy="50" r="1.5"/>
    <circle cx="138" cy="48" r="1.5"/>
  </g>

  <!-- Soft circle halo background -->
  <circle cx="100" cy="80" r="52" fill="url(#halo)"/>

  <!-- DOCUMENT with folded corner -->
  <g transform="translate(80 50)">
    <path d="M 0 0 L 28 0 L 40 12 L 40 60 L 0 60 Z" fill="url(#docGrad)"/>
    <path d="M 28 0 L 40 12 L 28 12 Z" fill="#6d28d9"/>
    <path d="M 28 0 L 28 12 L 40 12" stroke="#5b21b6" stroke-width="0.6" fill="none" opacity="0.5"/>
    <rect x="6" y="22" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity="0.65"/>
    <rect x="6" y="29" width="22" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="6" y="36" width="28" height="2.5" rx="1.25" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- PEN (rotated 115° clockwise from horizontal) -->
  <g transform="translate(112 64) rotate(115)">
    <rect x="0" y="0" width="44" height="7" rx="1.5" fill="#7c3aed"/>
    <rect x="0" y="0" width="44" height="2" rx="1" fill="#a78bfa" opacity="0.7"/>
    <path d="M 44 0 L 52 3.5 L 44 7 Z" fill="#1e1b4b"/>
    <path d="M 48 2.5 L 52 3.5 L 48 4.5 Z" fill="#fbbf24"/>
