<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <linearGradient id="envFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="envBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="envFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Confetti diamonds + dots scattered around -->
  <g fill="#a78bfa">
    <rect x="16" y="40" width="8" height="8" transform="rotate(45 20 44)"/>
    <rect x="174" y="44" width="8" height="8" transform="rotate(45 178 48)"/>
    <rect x="20" y="118" width="6" height="6" transform="rotate(45 23 121)"/>
    <rect x="176" y="122" width="6" height="6" transform="rotate(45 179 125)"/>
  </g>
  <g fill="#c4b5fd">
    <rect x="50" y="18" width="5" height="5" transform="rotate(45 52.5 20.5)"/>
    <rect x="148" y="18" width="5" height="5" transform="rotate(45 150.5 20.5)"/>
    <rect x="34" y="84" width="5" height="5" transform="rotate(45 36.5 86.5)"/>
    <rect x="162" y="84" width="5" height="5" transform="rotate(45 164.5 86.5)"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="36" cy="56" r="1.6"/>
    <circle cx="162" cy="60" r="1.6"/>
    <circle cx="44" cy="138" r="2"/>
    <circle cx="158" cy="140" r="2"/>
  </g>

  <!-- Soft halo behind the envelope -->
  <circle cx="100" cy="86" r="64" fill="url(#halo)"/>

  <!-- TOP OPEN FLAP (triangle folded UP) -->
  <path d="M 40 70 L 100 22 L 160 70 Z" fill="url(#envFlap)"/>

  <!-- ENVELOPE BACK -->
  <rect x="40" y="70" width="120" height="78" rx="3" fill="url(#envBack)"/>

  <!-- WHITE LETTER -->
  <rect x="54" y="44" width="92" height="80" rx="3" fill="#ffffff" stroke="#ede9fe" stroke-width="1.2"/>

  <!-- MEGAPHONE on the white letter — bullhorn with mouth opening + handle below -->
  <g transform="translate(72 58)">
    <!-- Cone body (filled gradient look via overlapping faces) -->
    <path d="M 4 14 L 30 4 L 36 4 L 36 24 L 30 24 L 4 16 Z" fill="#7c3aed"/>
    <!-- Top highlight strip for depth -->
    <path d="M 4 14 L 30 4 L 30 7 L 6 16 Z" fill="#a78bfa"/>
    <!-- Right-side cap (the mouth ring) — darker oval at the wide end -->
    <ellipse cx="33" cy="14" rx="3.5" ry="11" fill="#6d28d9"/>
    <!-- Inner mouth opening (deepest shadow) -->
    <ellipse cx="34.5" cy="14" rx="1.8" ry="8" fill="#3b0764"/>
    <!-- Handle BELOW the cone (perpendicular grip) -->
    <rect x="12" y="20" width="6" height="14" rx="2" fill="#5b21b6"/>
    <!-- Trigger button on handle -->
    <circle cx="15" cy="25" r="1.6" fill="#a78bfa"/>
    <!-- Sound waves curving out to the right -->
    <path d="M 41 6 L 47 0" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 42 14 L 51 14" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 41 22 L 47 28" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Two text lines on the letter (below the megaphone) -->
  <rect x="66" y="100" width="60" height="2.5" rx="1.25" fill="#c4b5fd"/>
  <rect x="66" y="107" width="48" height="2.5" rx="1.25" fill="#ddd6fe"/>

  <!-- FRONT FACE — triangle with apex UP, base along bottom (rounded corners) -->
  <path d="M 40 148
           L 100 88
           L 160 148
           L 160 145
           Q 160 148 157 148
           L 43 148
           Q 40 148 40 145
           Z"
        fill="url(#envFront)"/>

  <!-- Subtle crease lines from V apex outward for depth -->
  <path d="M 40 70 L 100 88 L 160 70" stroke="#5b21b6" stroke-width="0.8" fill="none" opacity="0.35"/>
</svg>
