<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 480 180">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: pure white -->
  <rect width="480" height="180" fill="#ffffff"/>

  <!-- Sparkles -->
  <g fill="#3b82f6">
    <path d="M 60 40 L 62 44 L 66 46 L 62 48 L 60 52 L 58 48 L 54 46 L 58 44 Z"/>
    <path d="M 420 50 L 422 54 L 426 56 L 422 58 L 420 62 L 418 58 L 414 56 L 418 54 Z"/>
    <path d="M 80 130 L 81.5 133 L 85 134.5 L 81.5 136 L 80 139 L 78.5 136 L 75 134.5 L 78.5 133 Z"/>
    <path d="M 400 130 L 401.5 133 L 405 134.5 L 401.5 136 L 400 139 L 398.5 136 L 395 134.5 L 398.5 133 Z"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="40" cy="80" r="2"/>
    <circle cx="440" cy="100" r="2"/>
    <circle cx="120" cy="30" r="1.6"/>
    <circle cx="360" cy="160" r="1.6"/>
  </g>

  <!-- Halo behind shield -->
  <circle cx="240" cy="90" r="60" fill="url(#halo)"/>

  <!-- SHIELD -->
  <path d="M 240 30
           L 280 46
           L 280 96
           Q 280 130 240 150
           Q 200 130 200 96
           L 200 46
           Z"
        fill="url(#shield)"/>

  <!-- Inner shield highlight -->
  <path d="M 220 48 Q 218 65 222 90" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Padlock body inside shield -->
  <rect x="222" y="82" width="36" height="28" rx="4" fill="#ffffff"/>
  <!-- Lock shackle -->
  <path d="M 230 82 L 230 70 Q 230 62 240 62 Q 250 62 250 70 L 250 82"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="240" cy="93" r="3" fill="#1e3a8a"/>
  <rect x="238.5" y="93" width="3" height="8" rx="1" fill="#1e3a8a"/>

  <!-- Digital code dots around shield (representing OTP digits) -->
  <g fill="#2563eb">
    <circle cx="165" cy="90" r="3"/>
    <circle cx="155" cy="90" r="2.4"/>
    <circle cx="146" cy="90" r="2"/>
    <circle cx="139" cy="90" r="1.6"/>
    <circle cx="315" cy="90" r="3"/>
    <circle cx="325" cy="90" r="2.4"/>
    <circle cx="334" cy="90" r="2"/>
    <circle cx="341" cy="90" r="1.6"/>
  </g>
</svg>
