<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Confetti diamonds + dots scattered around -->
  <g fill="#a78bfa">
    <rect x="16" y="44" width="8" height="8" transform="rotate(45 20 48)"/>
    <rect x="174" y="48" width="8" height="8" transform="rotate(45 178 52)"/>
    <rect x="20" y="118" width="6" height="6" transform="rotate(45 23 121)"/>
    <rect x="176" y="122" width="6" height="6" transform="rotate(45 179 125)"/>
  </g>
  <g fill="#c4b5fd">
    <rect x="50" y="22" width="5" height="5" transform="rotate(45 52.5 24.5)"/>
    <rect x="148" y="22" width="5" height="5" transform="rotate(45 150.5 24.5)"/>
    <rect x="34" y="86" width="5" height="5" transform="rotate(45 36.5 88.5)"/>
    <rect x="162" y="86" width="5" height="5" transform="rotate(45 164.5 88.5)"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="36" cy="58" r="1.6"/>
    <circle cx="162" cy="62" r="1.6"/>
    <circle cx="44" cy="138" r="2"/>
    <circle cx="158" cy="140" r="2"/>
  </g>

  <!-- Soft halo behind the bell -->
  <circle cx="100" cy="80" r="60" fill="url(#halo)"/>

  <!-- Bell body: dome + skirt -->
  <path d="M 70 50
           Q 70 32 100 32
           Q 130 32 130 50
           L 138 100
           Q 138 108 130 108
           L 70 108
           Q 62 108 62 100
           Z"
        fill="url(#bellGrad)"/>

  <!-- Bell handle on top -->
  <circle cx="100" cy="28" r="6" fill="#5b21b6"/>

  <!-- Bell clapper (small ball at the bottom) -->
  <ellipse cx="100" cy="118" rx="9" ry="6" fill="#6d28d9"/>

  <!-- Inner bell highlight (subtle, gives depth) -->
  <path d="M 78 52 Q 78 40 100 40" stroke="#a78bfa" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Notification badge: red circle with white exclamation -->
  <circle cx="138" cy="48" r="13" fill="#ef4444"/>
  <circle cx="138" cy="48" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="136" y="42" width="4" height="9" rx="1.5" fill="#ffffff"/>
  <circle cx="138" cy="55" r="1.8" fill="#ffffff"/>
</svg>
