<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 200 200">
  <!-- Soft circle background -->
  <circle cx="100" cy="100" r="78" fill="#f5f3ff"/>

  <!-- Sparkle rays around the circle -->
  <g stroke="#7c3aed" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="100" y1="10" x2="100" y2="22"/>
    <line x1="178" y1="60" x2="190" y2="55"/>
    <line x1="178" y1="140" x2="190" y2="145"/>
    <line x1="100" y1="178" x2="100" y2="190"/>
    <line x1="22" y1="60" x2="10" y2="55"/>
    <line x1="22" y1="140" x2="10" y2="145"/>
  </g>

  <!-- Magnifying glass lens (outer ring) -->
  <circle cx="92" cy="92" r="46" fill="none" stroke="#7c3aed" stroke-width="6"/>

  <!-- Person silhouette inside the lens -->
  <circle cx="92" cy="82" r="13" fill="#7c3aed"/>
  <path d="M 72 116 Q 72 102 92 102 Q 112 102 112 116 Z" fill="#7c3aed"/>

  <!-- Magnifying glass handle (diagonal pill) -->
  <rect x="124" y="124" width="38" height="10" rx="5" transform="rotate(45 143 129)" fill="#7c3aed"/>

  <!-- Highlight on lens for depth -->
  <path d="M 64 70 Q 56 80 60 100" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
